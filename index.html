<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 外部との通信をすべて禁止（データはこの端末のブラウザから出ない） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>尾高キャンプ場 収支入力</title>
<style>
:root{
  --bg:#f5f4ef;--panel:#fff;--ink:#1f2421;--muted:#6b716c;--line:#e1dfd6;
  --accent:#2f6b4f;--accent-ink:#fff;--in:#1f6fb2;--out:#b5462f;
  --warn:#fff4d6;--warn-line:#e3c060;--chip:#edf2ee;--hl:#e6f2ea;--danger:#b3261e;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151816;--panel:#1e2220;--ink:#e7ebe8;--muted:#9aa29c;--line:#343b37;
  --accent:#5fae86;--accent-ink:#0e1310;--in:#72b2ee;--out:#ee8b74;
  --warn:#3a3220;--warn-line:#7a6526;--chip:#25302a;--hl:#24372c;--danger:#f2817a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
.file{color:var(--muted);font-size:13px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file b{color:var(--ink);font-weight:600}
.dirty{color:var(--out);font-weight:700}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.bk{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.btn.small{padding:4px 9px;font-size:13px}
nav{display:flex;gap:4px;padding:10px 16px 0;max-width:1400px;margin:0 auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);font-weight:600}
nav button.on{background:var(--panel);color:var(--ink);box-shadow:0 -1px 0 var(--line) inset}
main{max-width:1400px;margin:0 auto;padding:0 16px 40px}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.form{position:sticky;top:70px}
@media (max-width:900px){.form{position:static}}
.form h2,.panel h2{font-size:15px;margin:0 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:none;padding:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on[data-k="支出"]{background:var(--out);color:#fff}
.seg button.on[data-k="収入"]{background:var(--in);color:#fff}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.f{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amt{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);min-height:18px;text-align:right}
.hint.err{color:var(--danger)}
.actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.actions .primary{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.chips .cap{width:100%;font-size:12px;color:var(--muted)}
.chip{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip:hover{outline:1px solid var(--accent)}
.chip small{color:var(--muted)}
.editbar{display:none;background:var(--warn);border:1px solid var(--warn-line);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:8px}
.editing-mode .editbar{display:block}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters .f{width:auto;flex:1;min-width:110px;padding:6px 8px}
.filters .q{flex:2;min-width:160px}
.stat{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-bottom:8px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.tablewrap{max-height:calc(100vh - 230px);overflow:auto;border:1px solid var(--line);border-radius:10px}
@media (max-width:900px){.tablewrap{max-height:none}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.d,td.k{white-space:nowrap;font-variant-numeric:tabular-nums}
#list tr{cursor:pointer}
#list tr:hover td{background:var(--hl)}
#list tr.editing td{background:var(--warn)}
#list tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--hl)}to{background:transparent}}
td small{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;white-space:nowrap}
.tag.in{background:var(--in)}.tag.out{background:var(--out)}
.warnmark{color:var(--danger);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  #tbl thead{display:none}
  #list tr{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;padding:8px 10px;border-bottom:1px solid var(--line)}
  #list td{border:0;padding:0;background:none!important}
  #list td.d{grid-column:1;grid-row:1;font-size:13px;color:var(--muted)}
  #list td.k{grid-column:2;grid-row:1;font-size:13px}
  #list td.num{grid-column:3;grid-row:1/3;align-self:center;font-weight:700;font-size:15px}
  #list td.t{grid-column:1/3;grid-row:2}
  #list td.kb,#list td.pay{display:none}
}
.banner{display:none;max-width:1400px;margin:10px auto 0;padding:10px 14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:10px;gap:8px;align-items:center;flex-wrap:wrap}
.banner.on{display:flex}
.banner span{flex:1;min-width:200px}
.wrapb{padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card .l{font-size:12px;color:var(--muted)}
.card .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card.in .v{color:var(--in)}.card.out .v{color:var(--out)}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.sumgrid{grid-template-columns:1fr}}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%}
.sumtbl td,.sumtbl th{position:static;cursor:default}
.sumtbl tr.total td{font-weight:700;border-top:2px solid var(--line)}
.sumtbl tr.click{cursor:pointer}.sumtbl tr.click:hover td{background:var(--hl)}
.checks li{margin:4px 0}
.checks li a{color:var(--accent);cursor:pointer;text-decoration:underline}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog p{margin:0 0 14px;white-space:pre-line}
.knote{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.knote.nonexp{color:var(--danger)}
.kdesc td{font-size:13px}.kdesc td:first-child{white-space:nowrap}
td.ln{color:var(--muted);white-space:nowrap;width:1%}
.dropmask{display:none;position:fixed;inset:0;background:rgba(47,107,79,.15);border:3px dashed var(--accent);z-index:50;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent)}
.dropmask.on{display:flex}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>尾高キャンプ場 収支入力</h1>
  <div class="file" id="fileInfo">ファイル未読込</div>
  <div class="btns">
    <button class="btn" id="bOpen">CSVを開く</button>
    <button class="btn primary" id="bSave">保存</button>
    <button class="btn" id="bSaveAs">別名で保存</button>
    <button class="btn" id="bNew">新規</button>
    <label class="bk" title="保存前の入力をこの端末のブラウザに一時的に残します。共用の端末ではオフにしてください。"><input type="checkbox" id="bkOn">一時退避</label>
  </div>
  <input type="file" id="fileInput" accept=".csv,text/csv" multiple hidden>
</header>

<div class="wrapb"><div class="banner" id="restoreBanner">
  <span id="restoreText"></span>
  <button class="btn small primary" id="bRestore">復元する</button>
  <button class="btn small" id="bDiscard">破棄する</button>
</div></div>

<nav>
  <button class="on" data-view="vInput">入力・一覧</button>
  <button data-view="vSum">集計・確認</button>
</nav>

<main>
<section class="view on" id="vInput">
  <div class="grid">
    <div class="panel form" id="formPanel">
      <div class="editbar">既存の行を編集中です。</div>
      <div class="seg" id="seg">
        <button data-k="支出" class="on">支出</button>
        <button data-k="収入">収入</button>
      </div>
      <form id="form" autocomplete="off">
        <div class="row2">
          <div><label for="iDate">日付</label><input class="f" type="date" id="iDate" required></div>
          <div><label for="iPay">支払方法</label><select class="f" id="iPay"></select></div>
        </div>
        <label for="iKamoku">科目</label>
        <select class="f" id="iKamoku"></select>
        <div class="knote" id="kNote"></div>
        <label for="iAmount">金額（円）</label>
        <input class="f amt" id="iAmount" inputmode="decimal" placeholder="0" required>
        <div class="hint" id="amtHint">計算式も可（例: 12000*0.9）</div>
        <label for="iTekiyo">摘要</label>
        <input class="f" id="iTekiyo" list="tekiyoList" placeholder="例: 電気代">
        <datalist id="tekiyoList"></datalist>
        <label for="iBiko">備考</label>
        <input class="f" id="iBiko" placeholder="按分率・支払先など（任意）">
        <div class="actions">
          <button type="submit" class="btn primary" id="bSubmit">追加</button>
          <button type="button" class="btn" id="bDup" hidden>複製して追加</button>
          <button type="button" class="btn danger" id="bDel" hidden>削除</button>
          <button type="button" class="btn" id="bCancel" hidden>キャンセル</button>
        </div>
      </form>
      <div class="chips" id="chips"></div>
    </div>

    <div class="panel">
      <div class="filters">
        <select class="f" id="fKubun"><option value="">収入・支出</option><option>収入</option><option>支出</option></select>
        <select class="f" id="fKamoku"></select>
        <select class="f" id="fMonth"></select>
        <input class="f q" id="fQ" type="search" placeholder="摘要・備考で検索">
      </div>
      <div class="stat" id="stat"></div>
      <div class="tablewrap">
        <table id="tbl">
          <thead><tr>
            <th data-s="date">日付</th><th data-s="kubun">区分</th><th data-s="kamoku">科目</th>
            <th data-s="tekiyo">摘要</th><th data-s="pay">支払</th><th data-s="amount" class="num">金額</th>
          </tr></thead>
          <tbody id="list"></tbody>
        </table>
        <div class="empty" id="empty">CSVを開くか（ファイルをここへドロップしても可）、左の欄から入力を始めてください。</div>
      </div>
    </div>
  </div>
</section>

<section class="view" id="vSum">
  <div class="filters" style="margin-top:12px">
    <select class="f" id="sYear" style="max-width:160px"></select>
    <select class="f" id="sForm" style="max-width:300px" title="申告様式">
      <option value="white">白色申告（収支内訳書）</option>
      <option value="blue">青色申告（青色申告決算書）</option>
    </select>
  </div>
  <div class="cards" id="cards"></div>
  <div class="sumgrid">
    <div class="panel"><h2>科目別</h2><table class="sumtbl" id="sumKamoku"></table></div>
    <div class="panel"><h2>月別</h2><table class="sumtbl" id="sumMonth"></table></div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>確認事項</h2><ul class="checks" id="checks"></ul></div>
  <div class="panel" style="margin-top:14px">
    <h2 id="kdescTitle"></h2>
    <table class="sumtbl kdesc" id="kdesc"></table>
  </div>
</section>
</main>

<dialog id="dlg"><p id="dlgText"></p><div class="actions" id="dlgBtns"></div></dialog>
<div class="dropmask" id="dropmask">CSVをドロップして読み込み</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------- 定数 ----------
// 科目マスター。line は青色申告決算書（一般用）の欄、白色（収支内訳書）の欄は WLINE。
// opt: 空欄㉕〜㉚に書き込む任意科目（最大6つ）／ nonExp: 経費に入れない支出
const KAMOKU = {
  '収入': [
    {n: '売上金額', line: '①', note: 'キャンプ場の利用料など本業の売上。決算書①「売上（収入）金額」。'},
    {n: '雑収入', line: '①', note: '自販機手数料・LINEスタンプ売上など本業以外の事業収入。①に含め、2ページ目の月別売上の「雑収入」欄に記入。'},
    {n: '家事消費', line: '①', note: '事業用の商品や飲食物を自家用に使った分。①に含める。'}
  ],
  '支出': [
    {n: '租税公課', line: '⑧', note: '事業用の税金・公的負担（軽自動車税・固定資産税・印紙代・事業税など）。所得税・住民税・罰金・延滞税は不可。'},
    {n: '荷造運賃', line: '⑨', note: '商品の発送費・梱包材。'},
    {n: '水道光熱費', line: '⑩', note: '電気・ガス・水道・暖房用灯油。自宅と兼用なら事業分だけ（家事按分）。ガソリン・機械油はここに入れない。'},
    {n: '旅費交通費', line: '⑪', note: '電車・バス・タクシー・高速代・駐車場代・出張宿泊費。'},
    {n: '通信費', line: '⑫', note: '固定電話・携帯電話・インターネット回線・切手・郵送代。私用と兼用なら按分。'},
    {n: '広告宣伝費', line: '⑬', note: 'ホームページ・チラシ・のぼり旗・名刺・年賀状・ノベルティ・宣伝のための郵送物。'},
    {n: '接待交際費', line: '⑭', note: '事業の関係者への飲食・贈答・手土産・お礼品。事業と関係のない付き合いや寄付は不可。'},
    {n: '損害保険料', line: '⑮', note: '事業用の火災保険・自動車保険（按分）。生命保険は不可（生命保険料控除）。'},
    {n: '修繕費', line: '⑯', note: '建物・設備・機械・車両の修理・補修。性能を高める大規模な改良は資産計上になる場合あり。'},
    {n: '消耗品費', line: '⑰', note: '10万円未満の備品・事務用品・日用品・作業用品・機械油など。'},
    {n: '減価償却費', line: '⑱', note: '10万円以上の資産（車両・機械・建物）を耐用年数で配分した額。決算書3ページで計算し、事業用割合を掛ける。'},
    {n: '福利厚生費', line: '⑲', note: '従業員のための慰安・健康・食事など。事業主本人や同居親族だけのための費用は不可。'},
    {n: '給料賃金', line: '⑳', note: '従業員・アルバイトへの給与。'},
    {n: '外注工賃', line: '㉑', note: '外部の人・業者に作業を頼んだ報酬（草刈り・清掃・整備・伐採などの謝礼）。'},
    {n: '利子割引料', line: '㉒', note: '事業用借入金の利息。元本の返済は不可。'},
    {n: '地代家賃', line: '㉓', note: '事業用の土地・建物の賃借料。'},
    {n: '貸倒金', line: '㉔', note: '回収できなくなった売掛金など。'},
    {n: '車両費', line: '㉕〜㉚', opt: true, note: '任意科目。事業用車両のガソリン・車検・部品・JAF等（按分後の額）。'},
    {n: '新聞図書費', line: '㉕〜㉚', opt: true, note: '任意科目。事業のための新聞・書籍・地図・雑誌。'},
    {n: '支払手数料', line: '㉕〜㉚', opt: true, note: '任意科目。振込手数料・送金手数料・各種サービス手数料。'},
    {n: '諸会費', line: '㉕〜㉚', opt: true, note: '任意科目。組合・観光協会・商工会・自治会などの会費（事業関係のもの）。'},
    {n: '雑費', line: '㉛', note: 'どの科目にも当てはまらない少額の経費。多用しない。'},
    {n: '経費外（事業主貸）', line: '—', nonExp: true, note: '事業の経費にならない支出（寄付・私用品・事業主本人の慰労など）。記録は残すが経費合計から除く。寄付は寄附金控除の対象か別途確認。'}
  ]
};
const STD = {'収入': KAMOKU['収入'].map(k => k.n), '支出': KAMOKU['支出'].map(k => k.n)};
const KINFO = {}; ['収入', '支出'].forEach(kb => KAMOKU[kb].forEach((k, i) => KINFO[kb + '|' + k.n] = {...k, order: i}));
// 白色申告（収支内訳書・一般用）の欄と並び順
const WLINE = {'売上金額': '①', '家事消費': '②', '雑収入': '③', '給料賃金': '⑪', '外注工賃': '⑫', '減価償却費': '⑬', '貸倒金': '⑭',
  '地代家賃': '⑮', '利子割引料': '⑯', '租税公課': 'イ', '荷造運賃': 'ロ', '水道光熱費': 'ハ', '旅費交通費': 'ニ', '通信費': 'ホ',
  '広告宣伝費': 'ヘ', '接待交際費': 'ト', '損害保険料': 'チ', '修繕費': 'リ', '消耗品費': 'ヌ', '福利厚生費': 'ル',
  '車両費': 'ヲ〜タ', '新聞図書費': 'ヲ〜タ', '支払手数料': 'ヲ〜タ', '諸会費': 'ヲ〜タ', '雑費': 'レ', '経費外（事業主貸）': '—'};
const WORDER = ['売上金額', '家事消費', '雑収入', '給料賃金', '外注工賃', '減価償却費', '貸倒金', '地代家賃', '利子割引料',

// ---------- CSV ----------
function parseCSV(t) {
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); out.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); out.push(row); }
  return out;
}
const csvCell = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function parseDate(s) {
  const m = String(s).trim().match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : '';
}
function parseAmount(s) {
  const t = String(s).replace(/[,，¥￥円\s]/g, '');
  return /^-?\d+$/.test(t) ? parseInt(t, 10) : NaN;
}
// 旧形式（支出科目/収入科目の列を持つスプレッドシート書き出し）と本アプリ形式の両方を読む
function tableToRows(table) {
  const hi = table.findIndex(r => r.map(c => c.trim()).includes('日付') && r.map(c => c.trim()).includes('金額'));
  if (hi < 0) throw new Error('「日付」「金額」の見出し行が見つかりません');
  const h = table[hi].map(c => c.trim());
  const col = name => h.indexOf(name);
  const kc = h.findIndex(c => c === '科目' || c.endsWith('科目'));
  const implied = kc >= 0 && h[kc].startsWith('収入') ? '収入' : kc >= 0 && h[kc].startsWith('支出') ? '支出' : '';
  const ci = {kubun: col('区分'), date: col('日付'), amount: col('金額'), tekiyo: col('摘要'), pay: col('支払方法'), biko: col('備考')};
  const res = [], renamed = {}; let skipped = 0;
  for (const r of table.slice(hi + 1)) {
    const g = i => i >= 0 && i < r.length ? r[i].trim() : '';
    const date = parseDate(g(ci.date)), amount = parseAmount(g(ci.amount));
    if (!date || isNaN(amount)) { if (r.some(c => c.trim() && !/^\d+$/.test(c.trim()))) skipped++; continue; }
    let kamoku = g(kc);
    let kb = g(ci.kubun) || implied;
    if (kb !== '収入' && kb !== '支出') kb = STD['収入'].includes(kamoku) || ALIAS['収入|' + kamoku] ? '収入' : '支出';
    const al = ALIAS[kb + '|' + kamoku];
    if (al) { renamed[`${kamoku}→${al}`] = (renamed[`${kamoku}→${al}`] || 0) + 1; kamoku = al; }
    res.push({kubun: kb, kamoku, date, amount, tekiyo: g(ci.tekiyo), pay: g(ci.pay), biko: g(ci.biko)});
  }
  return {rows: res, skipped, renamed};
}
function decode(buf) {
  try { return new TextDecoder('utf-8', {fatal: true}).decode(buf).replace(/^﻿/, ''); }
  catch { return new TextDecoder('shift_jis').decode(buf); }
}
function sortedForSave() {
  return rows.map((r, i) => [r, i]).sort((a, b) =>
    a[0].date.localeCompare(b[0].date) || (a[0].kubun === b[0].kubun ? 0 : a[0].kubun === '収入' ? -1 : 1) || a[1] - b[1]
  ).map(x => x[0]);
}
function toCSV() {
  const lines = [HEAD.join(',')];
  sortedForSave().forEach((r, i) => lines.push([i + 1, r.kubun, r.kamoku, r.date, r.amount, r.tekiyo, r.pay, r.biko].map(csvCell).join(',')));
  return '﻿' + lines.join('\r\n') + '\r\n';
}

// ---------- 読み込み ----------
async function loadFiles(files, handle) {
  let all = [], skipped = 0; const renamed = {};
  for (const f of files) {
    try {
      const r = tableToRows(parseCSV(decode(await f.arrayBuffer()))); all = all.concat(r.rows); skipped += r.skipped;
      for (const [k, v] of Object.entries(r.renamed)) renamed[k] = (renamed[k] || 0) + v;
    }
    catch (e) { await ask(`${f.name} を読み込めませんでした。\n${e.message}`, [['OK', 1, 'primary']]); return; }
  }
  let mode = 'replace';
  if (rows.length) {
    mode = await ask(`読み込んだ ${all.length} 件を、いま表示中の ${rows.length} 件に対してどうしますか？` + (dirty ? '\n（表示中のデータには未保存の変更があります）' : ''),
      [['追加する', 'add', 'primary'], ['置き換える', 'replace'], ['やめる', null]]);
    if (!mode) return;
  }
  let dup = 0;
  if (mode === 'add') {
    const key = r => [r.kubun, r.kamoku, r.date, r.amount, r.tekiyo].join('|');
    const have = new Set(rows.map(key));
    dup = all.filter(r => have.has(key(r))).length;
  } else {
    rows = []; editingId = null;
    if (files.length === 1) { fileName = files[0].name; fileHandle = handle || null; }
    else { fileName = ''; fileHandle = null; }
  }
  all.forEach(r => rows.push({id: nextId++, ...r}));
  const ren = Object.entries(renamed);
  dirty = mode === 'add' || files.length > 1 || ren.length > 0;
  if (ren.length) await ask('科目名を申告書の科目に読み替えました。保存すると新しい科目名で書き込まれます。\n' + ren.map(([k, v]) => `・${k}（${v}件）`).join('\n'), [['OK', 1, 'primary']]);
  if (!dirty) clearBackup(); else backup();
  refreshAll();
  let msg = `${all.length} 件を読み込みました`;
  if (skipped) msg += `（読めない行 ${skipped} 件を除外）`;
  if (dup) msg += `。既存と同じ内容が ${dup} 件あります（確認事項を参照）`;
  if (files.length > 1 && mode === 'replace') msg += '。複数ファイルを統合したので「別名で保存」してください';
  toast(msg);
}

async function save(asNew) {

        fileName = fileHandle.name;
      }
      const w = await fileHandle.createWritable();
      await w.write(new Blob([csv], {type: 'text/csv'})); await w.close();
      return saved(`「${fileName}」に保存しました`);
    } catch (e) {

      console.warn(e); fileHandle = null;
    }
  }
  if (asNew || !fileName) {
    const n = prompt('保存するファイル名', name);
    if (!n) return;
    name = /\.csv$/i.test(n) ? n : n + '.csv';
  }
  fileName = name;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();

}

function evalAmount(s) {
  const t = String(s).replace(/[,，¥￥円\s]/g, '').replace(/[×ｘx]/g, '*').replace(/÷/g, '/')
    .replace(/[０-９．＋－＊／（）]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  if (!t) return NaN;
  if (!/^[\d+\-*/.()]+$/.test(t)) return NaN;
  try { const v = Function('"use strict";return (' + t + ')')(); return isFinite(v) ? Math.round(v) : NaN; } catch { return NaN; }
}
function updateAmtHint() {
  const s = $('#iAmount').value, h = $('#amtHint');
  if (!s.trim()) { h.textContent = '計算式も可（例: 12000*0.9）'; h.classList.remove('err'); return; }
  const v = evalAmount(s);
  if (isNaN(v)) { h.textContent = '金額を数字で入力してください'; h.classList.add('err'); }
  else { h.textContent = `¥${fmt(v)}` + (/[+\-*/]/.test(s.replace(/^-/, '')) ? '（計算結果）' : ''); h.classList.remove('err'); }
}
function readForm() {

  if (isNaN(amount)) { toast('金額を正しく入力してください'); $('#iAmount').focus(); return null; }

}

function renderChips() {
  const m = new Map();
  rows.filter(r => r.kubun === kubun && r.tekiyo).forEach(r => {
    const k = r.kamoku + '\t' + r.tekiyo, o = m.get(k) || {kamoku: r.kamoku, tekiyo: r.tekiyo, n: 0, last: r, pay: r.pay};
    o.n++; if (r.date >= o.last.date) { o.last = r; o.pay = r.pay; } m.set(k, o);
  });
  const list = [...m.values()].filter(o => o.n >= 2).sort((a, b) => b.n - a.n).slice(0, 20);
  $('#chips').innerHTML = list.length ? '<div class="cap">よく使う入力（押すと科目と摘要が入ります）</div>' + list.map((o, i) =>
    `<button type="button" class="chip" data-i="${i}">${escH(o.tekiyo)} <small>${escH(o.kamoku)}</small></button>`).join('') : '';
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const o = list[b.dataset.i];
    fillKamoku(o.kamoku); $('#iTekiyo').value = o.tekiyo; fillPay(o.pay);
    $('#iAmount').placeholder = `前回 ${fmt(o.last.amount)}`; $('#iAmount').focus();
  });
}

// ---------- 一覧 ----------
function mainYear() {
  const c = {}; rows.forEach(r => { const y = r.date.slice(0, 4); c[y] = (c[y] || 0) + 1; });
  const ys = Object.keys(c).sort((a, b) => c[b] - c[a]);
  return ys[0] || '';
}
function fillFilters() {
  const fk = $('#fKamoku'), fm = $('#fMonth'), ck = fk.value, cm = fm.value;
  const ks = [...new Set(rows.map(r => r.kamoku))].sort((a, b) => a.localeCompare(b, 'ja'));
  fk.innerHTML = '<option value="">すべての科目</option>' + ks.map(k => `<option${k === ck ? ' selected' : ''}>${escH(k)}</option>`).join('');
  const ms = [...new Set(rows.map(r => r.date.slice(0, 7)))].sort();
  fm.innerHTML = '<option value="">すべての月</option>' + ms.map(m => `<option value="${m}"${m === cm ? ' selected' : ''}>${m.slice(0, 4)}年${+m.slice(5)}月</option>`).join('');
}
function filtered() {
  const fk = $('#fKubun').value, fc = $('#fKamoku').value, fm = $('#fMonth').value, q = $('#fQ').value.trim().toLowerCase();
  return rows.filter(r => (!fk || r.kubun === fk) && (!fc || r.kamoku === fc) && (!fm || r.date.startsWith(fm))
    && (!q || (r.tekiyo + ' ' + r.biko + ' ' + r.kamoku + ' ' + r.pay).toLowerCase().includes(q)));
}
function renderList() {
  const y = mainYear();
  let list = filtered();
  const dir = sortAsc ? 1 : -1;
  list.sort((a, b) => {
    const x = a[sortKey], z = b[sortKey];
    const c = typeof x === 'number' ? x - z : String(x).localeCompare(String(z), 'ja');
    return c * dir || (a.date.localeCompare(b.date)) * dir || (a.id - b.id) * dir;
  });
  document.querySelectorAll('#tbl th').forEach(th => {
    th.textContent = th.textContent.replace(/[ ▲▼]+$/, '') + (th.dataset.s === sortKey ? (sortAsc ? ' ▲' : ' ▼') : '');
  });
  $('#list').innerHTML = list.map(r => {
    const off = y && !r.date.startsWith(y);
    return `<tr data-id="${r.id}" class="${r.id === editingId ? 'editing' : ''}${r.id === flashId ? ' flash' : ''}">
      <td class="d">${off ? '<span class="warnmark" title="他の年の日付です">!</span> ' : ''}${r.date.replace(/-/g, '/')}</td>
      <td class="kb"><span class="tag ${r.kubun === '収入' ? 'in' : 'out'}">${r.kubun}</span></td>
      <td class="k">${escH(r.kamoku)}</td>
      <td class="t">${escH(r.tekiyo) || '<span style="color:var(--muted)">（摘要なし）</span>'}${r.biko ? `<small>${escH(r.biko)}</small>` : ''}</td>
      <td class="pay">${escH(r.pay)}</td>
      <td class="num" style="color:var(--${r.kubun === '収入' ? 'in' : 'out'})">${fmt(r.amount)}</td></tr>`;
  }).join('');
  $('#empty').style.display = rows.length ? 'none' : 'block';
  $('#empty').textContent = rows.length ? '' : 'CSVを開くか（ファイルをここへドロップしても可）、左の欄から入力を始めてください。';
  if (rows.length && !list.length) { $('#empty').style.display = 'block'; $('#empty').textContent = '条件に合う行がありません'; }
  const si = list.filter(r => r.kubun === '収入').reduce((s, r) => s + r.amount, 0);
  const so = list.filter(isExp).reduce((s, r) => s + r.amount, 0);
  const sn = list.filter(r => NONEXP.has(r.kamoku) && r.kubun === '支出').reduce((s, r) => s + r.amount, 0);
  $('#stat').innerHTML = `<span>表示 <b>${list.length}</b> / ${rows.length} 件</span><span>収入 <b>¥${fmt(si)}</b></span><span>経費 <b>¥${fmt(so)}</b></span><span>差引 <b>¥${fmt(si - so)}</b></span>`
    + (sn ? `<span>経費外 <b>¥${fmt(sn)}</b></span>` : '');
  if (flashId) setTimeout(() => { flashId = null; }, 50);
  if (flashId) { const tr = document.querySelector(`#list tr[data-id="${flashId}"]`); tr && tr.scrollIntoView({block: 'nearest'}); }
}

// ---------- 集計 ----------
function renderSummary() {
  const ys = [...new Set(rows.map(r => r.date.slice(0, 4)))].sort();
  const sel = $('#sYear'), cur = sel.value || mainYear();
  sel.innerHTML = '<option value="">全期間</option>' + ys.map(y => `<option value="${y}"${y === cur ? ' selected' : ''}>${y}年</option>`).join('');
  const yr = sel.value;
  const data = rows.filter(r => !yr || r.date.startsWith(yr));
  const ti = data.filter(r => r.kubun === '収入').reduce((s, r) => s + r.amount, 0);
  const to = data.filter(isExp).reduce((s, r) => s + r.amount, 0);
  const tn = data.filter(r => r.kubun === '支出' && !isExp(r)).reduce((s, r) => s + r.amount, 0);
  $('#cards').innerHTML = `
    <div class="card in"><div class="l">収入金額</div><div class="v">¥${fmt(ti)}</div></div>
    <div class="card out"><div class="l">経費合計</div><div class="v">¥${fmt(to)}</div></div>
    <div class="card"><div class="l">${FORM === 'blue' ? '差引（青色申告特別控除前）' : '所得金額（専従者控除前）'}</div><div class="v">¥${fmt(ti - to)}</div></div>
    <div class="card"><div class="l">経費外（事業主貸）</div><div class="v">¥${fmt(tn)}</div></div>`;
  let h = '<tr><th>欄</th><th>科目</th><th class="num">件数</th><th class="num">金額</th></tr>';
  const group = (title, cls, pred, t, color) => {
    const g = {}; data.filter(pred).forEach(r => { g[r.kamoku] = g[r.kamoku] || {n: 0, s: 0, kb: r.kubun}; g[r.kamoku].n++; g[r.kamoku].s += r.amount; });
    const ent = Object.entries(g);
    if (!ent.length) return;
    h += `<tr><td colspan="4"><span class="tag ${cls}">${title}</span></td></tr>`;
    const ord = n => (kinfo(g[n].kb, n) || {order: 900}).order;
    ent.sort((a, b) => ord(a[0]) - ord(b[0])).forEach(([n, o]) => {
      const info = kinfo(o.kb, n);
      h += `<tr class="click" data-k="${o.kb}" data-c="${escH(n)}"><td class="ln">${info ? info.line : F().optLine}</td><td>${escH(n)}${info ? '' : ` <span class="warnmark" title="${F().short}にない科目">!</span>`}<div class="bar"><i style="width:${t ? o.s / t * 100 : 0}%;background:${color}"></i></div></td><td class="num">${o.n}</td><td class="num">${fmt(o.s)}</td></tr>`;
    });
    h += `<tr class="total"><td></td><td>${title}計</td><td></td><td class="num">${fmt(t)}</td></tr>`;
  };
  group('収入', 'in', r => r.kubun === '収入', ti, 'var(--in)');
  group('経費', 'out', isExp, to, 'var(--out)');
  group('経費外', 'out', r => r.kubun === '支出' && !isExp(r), tn, 'var(--muted)');
  $('#sumKamoku').innerHTML = h;
  $('#sumKamoku').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    showView('vInput'); $('#fKubun').value = tr.dataset.k; fillFilters(); $('#fKamoku').value = tr.dataset.c;
    $('#fMonth').value = ''; $('#fQ').value = ''; renderList();
  });
  const mm = {}; data.forEach(r => {
    const m = r.date.slice(0, 7); mm[m] = mm[m] || {i: 0, o: 0};
    if (r.kubun === '収入') mm[m].i += r.amount; else if (isExp(r)) mm[m].o += r.amount;
  });
  let m = '<tr><th>月</th><th class="num">収入</th><th class="num">経費</th><th class="num">差引</th></tr>';
  Object.keys(mm).sort().forEach(k => {
    const o = mm[k];
    m += `<tr class="click" data-m="${k}"><td>${yr ? '' : k.slice(0, 4) + '年'}${+k.slice(5)}月</td><td class="num">${fmt(o.i)}</td><td class="num">${fmt(o.o)}</td><td class="num">${fmt(o.i - o.o)}</td></tr>`;
  });
  m += `<tr class="total"><td>合計</td><td class="num">${fmt(ti)}</td><td class="num">${fmt(to)}</td><td class="num">${fmt(ti - to)}</td></tr>`;
  $('#sumMonth').innerHTML = m;
  $('#sumMonth').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    showView('vInput'); fillFilters(); $('#fMonth').value = tr.dataset.m; $('#fKubun').value = ''; $('#fKamoku').value = ''; $('#fQ').value = ''; renderList();
  });
  renderChecks();
}
function renderChecks() {
  const items = [], y = mainYear();
  const off = rows.filter(r => y && !r.date.startsWith(y));
  if (off.length) items.push([`${y}年以外の日付が ${off.length} 件あります（日付の打ち間違いの可能性）`, off]);
  const key = r => [r.kubun, r.kamoku, r.date, r.amount].join('|'), g = {};
  rows.forEach(r => (g[key(r)] = g[key(r)] || []).push(r));
  const dups = Object.values(g).filter(a => a.length > 1).flat();
  if (dups.length) items.push([`同じ日・同じ科目・同じ金額の行が ${dups.length} 件あります（二重入力の可能性）`, dups]);
  const nonStd = rows.filter(r => !KINFO[r.kubun + '|' + r.kamoku]);
  if (nonStd.length) items.push([`${F().short}にない科目の行が ${nonStd.length} 件あります（${[...new Set(nonStd.map(r => r.kamoku))].join('、')}）。任意科目として空欄に書くか、${F().short}の科目に付け替えてください`, nonStd]);
  const optUsed = new Set(rows.filter(r => r.kubun === '支出' && (!KINFO['支出|' + r.kamoku] || KINFO['支出|' + r.kamoku].opt)).map(r => r.kamoku));
  if (optUsed.size > F().optMax) items.push([`任意科目が ${optUsed.size} 個あります。${F().short}の空欄は${F().optMax}行（${F().optLine}）までなので、まとめてください（${[...optUsed].join('、')}）`, null]);
  const nonE = rows.filter(r => r.kubun === '支出' && !isExp(r));
  if (nonE.length) items.push([`経費外（事業主貸）が ${nonE.length} 件あります。経費合計には含めていません`, nonE]);
  const noT = rows.filter(r => !r.tekiyo);
  if (noT.length) items.push([`摘要が空の行が ${noT.length} 件あります`, noT]);
  const zero = rows.filter(r => r.amount <= 0);
  if (zero.length) items.push([`金額が0円以下の行が ${zero.length} 件あります`, zero]);
  const noPay = rows.filter(r => !r.pay);
  if (noPay.length && noPay.length < rows.length) items.push([`支払方法が未指定の行が ${noPay.length} 件あります（任意）`, noPay]);
  else if (rows.length && noPay.length === rows.length) items.push(['支払方法はまだ1件も入力されていません（任意。現金と預金の動きを後で確かめたいときに使います）', null]);
  const ul = $('#checks');
  ul.innerHTML = items.length ? items.map((it, i) => `<li>${escH(it[0])}${it[1] ? ` <a data-i="${i}">一覧で見る</a>` : ''}</li>`).join('') : '<li>特に問題は見つかりません。</li>';
  ul.querySelectorAll('a').forEach(a => a.onclick = () => {
    const ids = new Set(items[a.dataset.i][1].map(r => r.id));
    showView('vInput'); $('#fKubun').value = ''; $('#fKamoku').value = ''; $('#fMonth').value = ''; $('#fQ').value = '';
    renderList();
    document.querySelectorAll('#list tr').forEach(tr => tr.style.display = ids.has(+tr.dataset.id) ? '' : 'none');
    $('#stat').insertAdjacentHTML('afterbegin', `<span><b>確認対象 ${ids.size} 件のみ表示中</b>（絞り込みを変えると解除）</span>`);
  });
}

// ---------- 全体 ----------
function renderFileInfo() {
  $('#fileInfo').innerHTML = (fileName ? `<b>${escH(fileName)}</b>` : rows.length ? '<b>（未保存の新規データ）</b>' : 'ファイル未読込')
    + (dirty ? ' <span class="dirty">● 未保存</span>' : rows.length ? ' 保存済み' : '');
  document.title = (dirty ? '● ' : '') + '尾高キャンプ場 収支入力';
}
function refreshAll() { setKubun(kubun); fillPay($('#iPay').value); fillFilters(); renderList(); renderSummary(); renderFileInfo(); }
function changed() { dirty = true; backup(); fillFilters(); fillKamoku(); renderChips(); fillTekiyo(); renderList(); renderSummary(); renderFileInfo(); }
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === id));
  if (id === 'vSum') renderSummary();
}

// ---------- イベント ----------
$('#form').addEventListener('submit', e => submitForm(e));
$('#bDup').onclick = e => submitForm(e, true);
$('#bDel').onclick = deleteRow;
$('#bCancel').onclick = endEdit;
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setKubun(b.dataset.k));
$('#iKamoku').addEventListener('change', () => {
  if ($('#iKamoku').value === '__add') {
    const n = (prompt(`追加する${kubun}の科目名`) || '').trim();
    if (n) { customKamoku[kubun].add(n); fillKamoku(n); } else fillKamoku(kamokuList(kubun)[0]);
  } else fillTekiyo();
  showKNote();
  $('#iAmount').placeholder = '0';
});
$('#iAmount').addEventListener('input', updateAmtHint);
$('#iAmount').addEventListener('blur', () => { const v = evalAmount($('#iAmount').value); if (!isNaN(v)) $('#iAmount').value = v; updateAmtHint(); });
$('#list').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) startEdit(+tr.dataset.id); });
document.querySelectorAll('#tbl th').forEach(th => th.onclick = () => {
  if (sortKey === th.dataset.s) sortAsc = !sortAsc; else { sortKey = th.dataset.s; sortAsc = th.dataset.s !== 'date' && th.dataset.s !== 'amount'; }
  renderList();
});
['#fKubun', '#fKamoku', '#fMonth'].forEach(s => $(s).addEventListener('change', renderList));
$('#fQ').addEventListener('input', renderList);
$('#sYear').addEventListener('change', renderSummary);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.view));
$('#bOpen').onclick = openFile;
$('#fileInput').addEventListener('change', e => e.target.files.length && loadFiles([...e.target.files], null));
$('#bSave').onclick = () => save(false);
$('#bSaveAs').onclick = () => save(true);
$('#bNew').onclick = async () => {
  if (rows.length && !(await ask(dirty ? '未保存の変更があります。破棄して新規作成しますか？' : '表示中のデータを閉じて新規作成しますか？', [['新規作成', 1, 'danger'], ['やめる', 0]]))) return;
  rows = []; fileHandle = null; fileName = ''; dirty = false; editingId = null; clearBackup(); endEdit(); refreshAll();
};
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(e.shiftKey); }
  if (e.key === 'Escape' && editingId) endEdit();
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
let dragN = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragN++; $('#dropmask').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#dropmask').classList.remove('on'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; $('#dropmask').classList.remove('on');
  const items = [...e.dataTransfer.items].filter(i => i.kind === 'file');
  let handle = null;
  if (items.length === 1 && items[0].getAsFileSystemHandle) { try { handle = await items[0].getAsFileSystemHandle(); } catch {} }
  const files = [...e.dataTransfer.files];
  if (files.length) loadFiles(files, handle && handle.kind === 'file' ? handle : null);
});

function renderKdesc() {
  $('#kdescTitle').textContent = `科目の説明（${F().name}に準拠）`;
  $('#kdesc').innerHTML = '<tr><th>欄</th><th>科目</th><th>入れるもの・注意</th></tr>' + ['収入', '支出'].map(kb =>
    stdList(kb).map(n => { const k = kinfo(kb, n); return `<tr><td class="ln">${k.line}</td><td>${n}${k.opt ? '<small>任意科目</small>' : ''}</td><td>${escH(k.note)}</td></tr>`; }).join('')).join('');
}
$('#sForm').value = FORM;
$('#sForm').addEventListener('change', () => {
  FORM = $('#sForm').value;
  try { localStorage.setItem('odaka-form', FORM); } catch {}
  fillKamoku(); renderSummary(); renderKdesc();
});
renderKdesc();

// ---------- 起動 ----------
$('#iDate').value = today();
refreshAll();
checkBackup();
</script>
</body>
</html>
